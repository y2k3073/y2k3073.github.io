name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A765F8: ${{ secrets.A765F8 }}
          BF7D10: ${{ secrets.BF7D10 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A765F8', '')
          bm = os.environ.get('BF7D10', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 2d820029610fd09e7979d47f819b98a78138d5daa43998 -->', gm)
          if bm:
              s2 = s2.replace('<!-- b5a943734c7418e2a1bbd677f47f2b -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
